name: ios-unsigned-ipa

on:
  workflow_dispatch: {}
  push:
    branches: [ios-app, ios-redesign]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The real D7my-TV web app (unchanged main), pinned so the patch always applies.
      - name: Checkout D7my-TV web app
        uses: actions/checkout@v4
        with:
          ref: e96fa2844c450e3b31f6c51eabe3e2b3f5933836
          path: web-src

      - name: Build D7my-TV web app for iPhone
        working-directory: web-src
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: --max-old-space-size=6144
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -e
          git apply --whitespace=nowarn ../web-overlay/d7t-ios-web.patch
          # Optional: embeds the TMDB key from the repository secret (no-op when it is missing).
          node tools/tmdb/inject-tmdb-key.mjs
          npm i -g pnpm@10.33.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm nx build web --configuration=pwa --skip-nx-cache
          DIST=$(find dist/apps/web -name index.html -maxdepth 3 | head -n 1 | xargs dirname)
          echo "web dist: $DIST"
          rm -rf ../modules/d7t-native/ios/web
          mkdir -p ../modules/d7t-native/ios/web
          cp -R "$DIST"/. ../modules/d7t-native/ios/web/
          ls ../modules/d7t-native/ios/web | head -n 20
          du -sh ../modules/d7t-native/ios/web

      - name: Select Xcode 26 (Swift 6.2 needed by Expo modules)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Tool versions
        run: |
          xcodebuild -version
          python3 --version
          ls /Applications | grep -i xcode || true

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/D7T.xcworkspace \
            -scheme D7T \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { echo '=== ERRORS ==='; grep -nE 'error:|fatal error|Command .* failed|\*\* BUILD FAILED' -B3 -A12 xcodebuild.log | head -n 150; echo '=== LOG TAIL ==='; tail -n 60 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry D7T-unsigned.ipa Payload
          ls -lh D7T-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: D7T-unsigned-ipa
          path: D7T-unsigned.ipa
          retention-days: 14

      # The redesign branch publishes to its own branch so the last approved IPA on ios-ipa is kept.
      - name: Publish IPA parts (ios-ipa, or ios-ipa-redesign for the redesign branch)
        run: |
          if [ "${GITHUB_REF_NAME}" = "ios-app" ]; then OUT_BRANCH=ios-ipa; else OUT_BRANCH=ios-ipa-redesign; fi
          mkdir out && cd out
          split -b 45m -d ../D7T-unsigned.ipa D7T-unsigned.ipa.part
          shasum -a 256 ../D7T-unsigned.ipa > SHA256.txt
          unzip -l ../D7T-unsigned.ipa | head -n 40 > CONTENTS.txt
          git init -q
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q -b "$OUT_BRANCH"
          git add -A && git commit -q -m "IPA from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$OUT_BRANCH"
