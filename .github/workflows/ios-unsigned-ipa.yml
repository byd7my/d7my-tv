name: ios-unsigned-ipa

on:
  workflow_dispatch: {}
  push:
    branches: [ios-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      EXPO_USE_PRECOMPILED_MODULES: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tool versions
        run: |
          xcodebuild -version
          python3 --version
          ls /Applications | grep -i xcode || true

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/D7T.xcworkspace \
            -scheme D7T \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { echo '=== ERRORS ==='; grep -nE 'error:|fatal error|Command .* failed|\*\* BUILD FAILED' -B3 -A12 xcodebuild.log | head -n 150; echo '=== LOG TAIL ==='; tail -n 60 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry D7T-unsigned.ipa Payload
          ls -lh D7T-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: D7T-unsigned-ipa
          path: D7T-unsigned.ipa
          retention-days: 14

      - name: Publish IPA parts to ios-ipa branch
        run: |
          mkdir out && cd out
          split -b 45m -d ../D7T-unsigned.ipa D7T-unsigned.ipa.part
          shasum -a 256 ../D7T-unsigned.ipa > SHA256.txt
          unzip -l ../D7T-unsigned.ipa | head -n 40 > CONTENTS.txt
          git init -q
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ios-ipa
          git add -A && git commit -q -m "IPA from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-ipa
